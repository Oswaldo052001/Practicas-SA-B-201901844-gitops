# Practica 10 - Generador de carga permanente (k6). Mantiene ~4 peticiones/s
# de usuarios sinteticos contra el api-gateway. Cumple dos funciones:
#   1. Los paneles y los SLO siempre tienen datos que mostrar.
#   2. El canary (Argo Rollouts) recibe trafico "real" mientras se analiza:
#      sin trafico, el AnalysisTemplate no tendria que medir y fallaria.
# Mezcla de operaciones por iteracion: 40 % listar reservas, 25 % login,
# 20 % crear reserva, 15 % login con clave incorrecta (4xx esperado: no
# cuenta contra el SLO, que solo mira 5xx).
#
# Para pausarlo (p. ej. para demostrar el estado "sin trafico"):
#   kubectl -n observability scale deploy/loadgen --replicas=0
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-script
  namespace: observability
data:
  script.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";

    const BASE = __ENV.BASE_URL || "http://api-gateway.sa-p8.svc.cluster.local:3000";
    const CLAVE = "Loadgen-p10-clave";
    const JSON_H = { headers: { "Content-Type": "application/json" } };

    export const options = {
      // Sin keep-alive: cada peticion abre una conexion nueva. Con conexiones
      // persistentes, kube-proxy solo reparte al CONECTAR, asi que los pods
      // nuevos (el canary) nunca recibirian trafico de los VUs ya conectados
      // (visto en vivo: el canary solo recibia los probes /health).
      noConnectionReuse: true,
      scenarios: {
        trafico: {
          executor: "constant-arrival-rate",
          rate: 3,
          timeUnit: "1s",
          duration: "720h",
          preAllocatedVUs: 8,
          maxVUs: 40,
        },
      },
    };

    export function setup() {
      // DOS usuarios con roles distintos, a proposito:
      //  - lector:   solo LISTA y hace login; nunca recibe reservas, asi que su
      //              listado siempre es chico y barato.
      //  - escritor: solo CREA reservas; nadie lista las suyas.
      // Con un unico usuario que creaba (0.8/s) y listaba (1.6/s) a la vez, su
      // listado crecio sin limite (16 mil filas en un dia): cada GET tardaba de 6
      // a 44 s, superaba el MAX_PAYLOAD de NATS (1 MB) y dejaba sin CPU al pod
      // hasta que fallaba su /health y entraba en CrashLoopBackOff.
      const sufijo = Date.now();
      const lector = `loadgen-lector-${sufijo}@p10.local`;
      const escritor = `loadgen-escritor-${sufijo}@p10.local`;
      const ids = {};
      for (const correo of [lector, escritor]) {
        for (let i = 0; i < 30; i++) {
          const r = http.post(`${BASE}/api/auth/registro`, JSON.stringify({ correo, password: CLAVE, rol: "cliente" }), JSON_H);
          if (r.status === 201) {
            ids[correo] = r.json("id");
            break;
          }
          sleep(5);
        }
      }
      return { lectorId: ids[lector] || 1, escritorId: ids[escritor] || 1, correo: lector };
    }

    export default function (data) {
      const dado = Math.random();
      let r;
      if (dado < 0.55) {
        r = http.get(`${BASE}/api/reservas/usuario/${data.lectorId}`);
        check(r, { "listar 200": (x) => x.status === 200 });
      } else if (dado < 0.70) {
        r = http.post(`${BASE}/api/auth/login`, JSON.stringify({ correo: data.correo, password: CLAVE }), JSON_H);
        check(r, { "login 200": (x) => x.status === 200 });
      } else if (dado < 0.74) {
        // El gateway reemplaza el prefijo /api/reservas por /reservas, asi que
        // crear una reserva es POST /api/reservas. Ritmo bajo (~0.16/s): basta
        // para alimentar app_reservas_total sin inflar la base de datos.
        r = http.post(
          `${BASE}/api/reservas`,
          JSON.stringify({ usuarioId: data.escritorId, funcionId: 1 + Math.floor(Math.random() * 3), asientos: 1 + Math.floor(Math.random() * 3) }),
          JSON_H
        );
        check(r, { "reserva 201": (x) => x.status === 201 });
      } else {
        r = http.post(`${BASE}/api/auth/login`, JSON.stringify({ correo: data.correo, password: "clave-incorrecta" }), JSON_H);
        check(r, { "login invalido 401": (x) => x.status === 401 });
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: observability
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      annotations:
        checksum/script: "p10-v4"
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: obs-pool
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "--quiet", "/scripts/script.js"]
          env:
            - name: BASE_URL
              value: http://api-gateway.sa-p8.svc.cluster.local:3000
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
          volumeMounts:
            - { name: script, mountPath: /scripts }
      volumes:
        - name: script
          configMap:
            name: loadgen-script
