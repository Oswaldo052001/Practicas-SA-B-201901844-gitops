# values-secrets.yaml
# Los secretos reales (passwords de postgresql y nats) YA NO viven aqui en
# texto plano. Se gestionan con Sealed Secrets: el Secret real se sella con
# `kubeseal` contra el controlador instalado en el cluster (ver
# P8/gitops-bootstrap/bootstrap-argocd.sh) y el resultado -seguro de
# publicar, aunque el repo sea publico- queda en
# templates/sealed-secrets.yaml, dentro de este mismo chart. Este archivo
# solo le indica a cada subchart el NOMBRE del Secret ya sellado/
# desencriptado en el cluster (existingSecret), nunca su valor.
postgresql:
  auth:
    existingSecret: "sa-platform-postgresql"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: db-password

nats:
  auth:
    existingSecret: "sa-platform-nats"

# jwtSecret / aesSecretKey: reservados para cuando algun servicio los
# consuma (por ahora ningun Deployment los lee). Cuando se cableen, su
# valor real tambien debe ir sellado en templates/sealed-secrets.yaml,
# nunca como texto plano en este archivo.
