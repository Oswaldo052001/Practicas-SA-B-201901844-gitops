# values-p9-resilience.yaml
# Overlay de la Practica 9. Se aplica DESPUES de values-images.yaml (gana
# sobre todos los anteriores) y NO toca nada de lo que ya usa la Practica 8
# calificada (no redefine imagenes, recursos ni el resto de servicios).
#
# Dos cosas, una por cada criterio de la rubrica:
#
# 1) Continuidad/consistencia del respaldo de postgresql (criterio 2.3 y
#    la leccion de clase "mejor un dump que un snapshot"): el snapshot de
#    disco de GCE que hace Velero es consistente a nivel de bloque
#    (crash-consistent), pero no garantiza que una transaccion a medio
#    escribir quede en un estado limpio. Los hooks de Velero abajo corren
#    un "pg_dumpall" ANTES del snapshot (queda guardado dentro del mismo
#    volumen que se snapshotea, como respaldo logico adicional/fallback) -
#    ver hooks.pre en templates/sealed-secrets.yaml... no, ver la anotacion
#    "pre.hook.backup.velero.io" abajo.
#
# 2) Resiliencia ante perdida de nodo (criterio 2.5): api-gateway (el unico
#    punto de entrada publico) pasa de 1 a 2 replicas fijas, con
#    anti-afinidad de pod (dos replicas nunca en el mismo nodo) para que
#    "kubectl drain" de un nodo no tumbe las dos a la vez. El
#    PodDisruptionBudget (minAvailable=1) ya existia desde la Practica 8
#    (charts/api-gateway/templates/pdb.yaml) - aqui solo se garantizan las
#    2 replicas y la anti-afinidad que le faltaban para que el PDB tenga
#    algo que proteger.

postgresql:
  primary:
    podAnnotations:
      # Postgres del chart de Bitnami expone POSTGRES_PASSWORD (password
      # del usuario admin "postgres") como variable de entorno dentro del
      # propio contenedor. El dump queda en el mismo PersistentVolume que
      # se snapshotea (no ocupa almacenamiento aparte) y sirve como
      # respaldo logico de respaldo/verificacion ademas del snapshot.
      pre.hook.backup.velero.io/container: "postgresql"
      pre.hook.backup.velero.io/command: '["/bin/sh", "-c", "PGPASSWORD=$POSTGRES_PASSWORD pg_dumpall -U postgres -h localhost > /bitnami/postgresql/data/pg_dumpall_backup.sql"]'
      post.hook.backup.velero.io/container: "postgresql"
      post.hook.backup.velero.io/command: '["/bin/sh", "-c", "ls -la /bitnami/postgresql/data/pg_dumpall_backup.sql"]'

api-gateway:
  replicaCount: 2
  # values-dev.yaml (aplicado ANTES que este overlay, pero DESPUES de
  # values.yaml) fija hpa.minReplicas=1 para todos los microservicios como
  # ahorro de costo en este entorno de laboratorio - eso incluye a
  # api-gateway, y como el HPA reconcilia continuamente hacia su propio
  # minReplicas (sin carga real, no hay motivo para escalar por encima del
  # minimo), termina deshaciendo el replicaCount=2 de arriba en cuanto pasa
  # el primer ciclo de reconciliacion del HPA. Se fuerza aqui minReplicas=2
  # solo para api-gateway (el unico punto de entrada publico, criterio
  # 2.5) para que la prueba de perdida de nodo tenga de verdad 2 replicas
  # con anti-afinidad para proteger.
  hpa:
    minReplicas: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: api-gateway
