# values.example.yaml
# Ya NO se usa para copiar credenciales en texto plano a values-secrets.yaml.
# Los secretos reales se gestionan con Sealed Secrets:
#
#   1. Instalar el controlador (una vez, fuera de Terraform/CI):
#        P8/gitops-bootstrap/bootstrap-argocd.sh
#   2. Crear el Secret real LOCALMENTE (nunca se commitea tal cual):
#        kubectl create secret generic sa-platform-postgresql \
#          --namespace sa-p8 --dry-run=client -o yaml \
#          --from-literal=password=<password-usuario> \
#          --from-literal=postgres-password=<password-admin> \
#          > /tmp/pg-secret.yaml
#        kubectl create secret generic sa-platform-nats \
#          --namespace sa-p8 --dry-run=client -o yaml \
#          --from-literal=nats-user=sa_admin \
#          --from-literal=nats-password=<password-nats> \
#          > /tmp/nats-secret.yaml
#   3. Sellarlo con kubeseal (usa el certificado publico del controlador,
#      el resultado SI se puede publicar, solo el controlador lo puede leer):
#        kubeseal --format=yaml < /tmp/pg-secret.yaml   >> templates/sealed-secrets.yaml
#        kubeseal --format=yaml < /tmp/nats-secret.yaml >> templates/sealed-secrets.yaml
#   4. Borrar los archivos temporales sin sellar y hacer commit solo de
#      templates/sealed-secrets.yaml (ya sellado).
#
# values-secrets.yaml (este SI se versiona) solo declara los NOMBRES de
# esos Secrets via "existingSecret", nunca sus valores.
postgresql:
  auth:
    existingSecret: "sa-platform-postgresql"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

nats:
  auth:
    existingSecret: "sa-platform-nats"
