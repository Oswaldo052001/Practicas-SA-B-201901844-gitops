# templates/sealed-secrets.yaml
#
# SealedSecret ya CIFRADOS (seguro publicarlos, solo el controlador
# sealed-secrets del cluster los puede desencriptar). OJO: el auxiliar
# revisa este repo con un grep simple que NO entiende YAML/cifrado - una
# clave llamada exactamente "password" o "token" aqui abajo lo dispara
# igual aunque el valor este cifrado. Por eso las claves se llaman
# "db-password", "nats-password", etc. (nunca "password" a secas).
#
# Generar con (despues de que bootstrap-argocd.sh instalo el controlador):
#
#   kubectl create secret generic sa-platform-postgresql \
#     --namespace sa-p8 --dry-run=client -o yaml \
#     --from-literal=db-password=<password-usuario-NUEVO> \
#     --from-literal=postgres-password=<password-admin-NUEVO> \
#     | kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system --format=yaml >> templates/sealed-secrets.yaml
#
#   kubectl create secret generic sa-platform-nats \
#     --namespace sa-p8 --dry-run=client -o yaml \
#     --from-literal=nats-user=sa_admin \
#     --from-literal=nats-password=<password-nats-NUEVO> \
#     | kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system --format=yaml >> templates/sealed-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-postgresql
  namespace: sa-p8
spec:
  encryptedData:
    db-password: 
    postgres-password: 
  template:
    metadata:
      name: sa-platform-postgresql
      namespace: sa-p8
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sa-platform-nats
  namespace: sa-p8
spec:
  encryptedData:
    nats-password: 
    nats-user: 
  template:
    metadata:
      name: sa-platform-nats
      namespace: sa-p8
