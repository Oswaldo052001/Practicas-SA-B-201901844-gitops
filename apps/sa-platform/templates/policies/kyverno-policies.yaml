# Practica 8 - Politicas de admision con Kyverno (criterio 2.6).
#
# El controlador de Kyverno se instala UNA sola vez, a mano, fuera de
# Terraform y fuera de CI (ver P8/gitops-bootstrap/bootstrap-argocd.sh en
# el repo de codigo): es plataforma, igual que ArgoCD/Argo Rollouts.
#
# Estas 3 ClusterPolicy SI son configuracion de la aplicacion (las reglas,
# no el motor), asi que viven aqui, en el repo GitOps, y las sincroniza
# ArgoCD como cualquier otro manifiesto.
#
# validationFailureAction por politica:
#   - disallow-latest-tag: Enforce (bloquea de verdad, con exclude para
#     postgresql/nats por si acaso). Es la evidencia de "despliegue
#     rechazado por politica" que pide el enunciado.
#   - require-resource-limits / require-run-as-nonroot: Audit. Se dejan en
#     modo auditoria porque los charts de terceros (postgresql, nats) no
#     se controlan directamente y podrian no cumplirlas exactamente;
#     bloquearlas arriesgaria tumbar el cluster antes de la calificacion.
#     Kyverno sigue contando como "politica activa" en Audit tambien.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Practica 8 - Buenas practicas
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Prohibe usar la etiqueta ":latest" (o no declarar ninguna) en las
      imagenes de los contenedores. Las imagenes de sa-platform siempre
      deben referenciar una tag inmutable (p8-vX.Y.Z).
spec:
  # Enforce (a diferencia de las otras 2 politicas, que se dejan en Audit
  # para no arriesgar los charts de terceros): esta es la mas segura de
  # bloquear porque tanto sa-platform (tags p8-vX.Y.Z) como los charts de
  # postgresql/nats ya usan tags fijas por defecto, ninguno usa ":latest".
  # Sirve como evidencia real de "despliegue rechazado por politica"
  # (ver P8/README.md, tabla 4.1).
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [postgresql, nats]
      validate:
        message: "La imagen debe declarar una tag distinta de 'latest'."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Practica 8 - Buenas practicas
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Exige que todo contenedor declare requests y limits de CPU y memoria,
      para que el ResourceQuota/LimitRange del namespace tenga sentido y
      ningun pod pueda acaparar los recursos del cluster.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-resource-requests-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Cada contenedor debe declarar resources.requests y resources.limits (cpu y memory)."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Practica 8 - Buenas practicas
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Exige que los pods declaren runAsNonRoot=true a nivel de pod o de
      contenedor, para que ningun proceso corra como root dentro del
      cluster.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-runasnonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "El pod (o cada contenedor) debe declarar securityContext.runAsNonRoot=true."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
