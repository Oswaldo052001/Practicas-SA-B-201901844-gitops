# "global" con un valor por defecto propio: hace que "helm lint
# --with-subcharts" (que también lintea cada subchart de forma aislada,
# sin los values del chart padre) no truene con nil pointer al resolver
# .Values.global.namespace. Cuando este subchart se instala normalmente
# desde el chart padre, el "global" real (sa-p8) siempre sobreescribe
# este valor por defecto.
global:
  namespace: sa-p5
  environment: base

image:
  repository: nats
  tag: "2.10-alpine"
  pullPolicy: IfNotPresent
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 384Mi }
persistence:
  size: 1Gi
  storageClass: ""
jetstream:
  maxMemory: "256MB"
  maxFile: "1GB"
serviceAccount:
  create: true
auth:
  username: sa_admin
  # password: se define en values-secrets.yaml (no se versiona en el repo)
