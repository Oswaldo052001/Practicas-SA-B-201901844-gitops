{{- /*
Si nats.auth.existingSecret esta definido, el Secret real lo provee un
SealedSecret (ver templates/sealed-secrets.yaml en el chart raiz) con ESTE
MISMO nombre ({{ .Release.Name }}-nats), y este chart no crea nada aqui:
crearlo tambien chocaria con el que decodifica el SealedSecret.
*/ -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-nats
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "nats.labels" . | nindent 4 }}
type: Opaque
stringData:
  nats-user: {{ .Values.auth.username | default "sa_admin" | quote }}
  nats-password: {{ .Values.auth.password | required "nats.auth.password es obligatorio si no se usa nats.auth.existingSecret" | quote }}
{{- end }}
