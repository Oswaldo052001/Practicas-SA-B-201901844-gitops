# Practica 8, Fase 6 - copia del script k6 (ver P8/tests/k6/loadtest.js en
# el repo de codigo, que es la version canonica/reportable) empaquetada
# como ConfigMap para que el Job del AnalysisTemplate la pueda montar.
# Se duplica porque codigo y GitOps son repos independientes (requisito del
# enunciado); si se modifican los umbrales, actualizar los dos archivos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-k6-script
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
data:
  loadtest.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    // Umbrales del SLA interno de api-gateway (unico punto de entrada
    // publico del sistema): p95 de latencia bajo 500ms y menos de 5% de
    // error. Por debajo de esto el canary se considera degradado y no debe
    // promoverse - ver P8/tests/k6/loadtest.js para la justificacion
    // completa en el repo de codigo.
    export const options = {
      vus: 5,
      duration: '20s',
      thresholds: {
        http_req_duration: ['p(95)<500'],
        http_req_failed: ['rate<0.05'],
      },
    };

    const TARGET = __ENV.TARGET_URL || 'http://api-gateway-canary.{{ .Values.global.namespace | default "sa-p5" }}.svc.cluster.local:{{ .Values.service.port | default 3000 }}/ready-check';

    export default function () {
      const res = http.get(TARGET);
      check(res, { 'status es 200': (r) => r.status === 200 });
    }
