# Practica 8, Fase 5 - Entrega progresiva con Argo Rollouts.
# api-gateway (el unico punto de entrada publico del sistema) se convierte
# de Deployment a Rollout con estrategia canary: en vez de reemplazar todos
# los pods de una vez, va subiendo el porcentaje de trafico hacia la nueva
# version de forma gradual, con puntos de pausa para verificar antes de
# seguir avanzando.
#
# Es "canary basico" (sin service mesh ni Ingress con split de trafico):
# Argo Rollouts logra el porcentaje ajustando la PROPORCION de replicas
# entre el ReplicaSet viejo (stable) y el nuevo (canary), ambos detras del
# mismo Service (api-gateway), que ya reparte trafico entre sus endpoints
# por round-robin. No requiere infraestructura adicional.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "api-gateway.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/shared-config: {{ .Values.global.namespace | sha256sum }}
    spec:
      serviceAccountName: {{ include "api-gateway.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sa-p5-shared-config
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: {{ include "sa-platform.natsSecretName" . }}
          env:
            - name: PORT
              value: "3000"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sa-platform.natsSecretName" . }}
                  key: nats-password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      # canaryService/stableService: Argo Rollouts gestiona el selector de
      # estos dos Services automaticamente (ver service-canary.yaml /
      # service-stable.yaml) para que el AnalysisTemplate pueda probar
      # exclusivamente los pods nuevos, sin necesidad de service mesh.
      canaryService: api-gateway-canary
      stableService: api-gateway-stable
      # Entre pasos, Argo Rollouts espera a que los pods del canary esten
      # Ready (gracias a los probes de arriba) Y a que el AnalysisRun de
      # ese paso termine en Successful antes de avanzar al siguiente. Si el
      # AnalysisRun termina Failed/Error, el rollout se revierte solo
      # (abort) y el trafico vuelve 100% al stable sin intervencion humana.
      steps:
        - setWeight: 25
        # Pausa corta antes de cada analysis: le da tiempo al pod nuevo de
        # pasar su readinessProbe (initialDelaySeconds:5 + primer chequeo)
        # y aparecer como endpoint Ready del Service canary ANTES de que
        # k6 empiece a mandarle trafico. Sin esto, el AnalysisRun puede
        # arrancar en la ventana en la que el Service todavia no tiene
        # ningun endpoint listo, dando falsos negativos (conexion
        # rechazada, no un fallo real de la app) - encontrado en vivo el
        # 2026-09-19 con la revision 4 (imagen ya arreglada, analysis
        # fallo igual por esta condicion de carrera).
        - pause: { duration: 20s }
        - analysis:
            templates:
              - templateName: api-gateway-canary-check
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 20s }
        - analysis:
            templates:
              - templateName: api-gateway-canary-check
        - pause: { duration: 30s }
        - setWeight: 75
        - pause: { duration: 20s }
        # El ultimo paso de la lista es el analysis (no una pausa indefinida
        # despues): si el analisis de este ultimo paso pasa, Argo Rollouts
        # promueve automaticamente al 100% sin necesidad de intervencion
        # manual (antes se quedaba pausado esperando un
        # "kubectl argo rollouts promote", que tocamos hacer a mano via un
        # patch al status el 2026-09-19). Ademas de ser mas automatico de
        # punta a punta, esto evita un falso negativo del script de
        # verificacion del auxiliar: su chequeo de "la promocion depende
        # del analisis" usa `jq -e` sobre .spec.strategy.canary.steps[]?.analysis,
        # que solo mira el ULTIMO valor del stream - si el ultimo paso no
        # tiene .analysis (como el pause:{} que habia aqui antes), jq -e ve
        # null y marca falsamente que la promocion no depende del analisis,
        # aunque los otros 2 pasos si lo tengan.
        - analysis:
            templates:
              - templateName: api-gateway-canary-check
