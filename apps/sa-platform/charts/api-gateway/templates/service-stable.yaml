# Practica 8, Fase 6 - Service dedicado que apunta EXCLUSIVAMENTE a los pods
# de la version estable (analogo a service-canary.yaml, ver ese archivo
# para la explicacion del mecanismo).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 3000 }}
      targetPort: 3000
