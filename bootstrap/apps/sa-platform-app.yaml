# Hija del app-of-apps (ver ../../bootstrap root Application, aplicada por
# Terraform en el repo de codigo: P9/terraform/bootstrap-app.tf). Antes
# vivia como P8/gitops-bootstrap/application.yaml en el repo de codigo y se
# aplicaba a mano con "kubectl apply"; ahora es un recurso mas,
# gestionado por GitOps igual que cualquier otra aplicacion.
#
# Unico cambio de contenido respecto a la version de P8: se agrega
# values-p9-resilience.yaml al final de la lista de valores (gana sobre
# los anteriores), con los hooks de respaldo de Velero para postgresql y
# las replicas/anti-afinidad de api-gateway para la prueba de perdida de
# nodo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Oswaldo052001/Practicas-SA-B-201901844-gitops.git
    targetRevision: main
    path: apps/sa-platform
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
        - values-p8.yaml
        - values-secrets.yaml
        - values-images.yaml
        - values-p9-resilience.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
