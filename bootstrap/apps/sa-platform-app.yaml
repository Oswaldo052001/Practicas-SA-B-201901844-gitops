# Hija del app-of-apps (ver ../../bootstrap root Application, aplicada por
# Terraform en el repo de codigo: P9/terraform/bootstrap-app.tf). Antes
# vivia como P8/gitops-bootstrap/application.yaml en el repo de codigo y se
# aplicaba a mano con "kubectl apply"; ahora es un recurso mas,
# gestionado por GitOps igual que cualquier otra aplicacion.
#
# Cambios de contenido respecto a la version de P8:
# 1. Se agrega values-p9-resilience.yaml al final de la lista de valores
#    (gana sobre los anteriores), con los hooks de respaldo de Velero
#    para postgresql y las replicas/anti-afinidad de api-gateway para la
#    prueba de perdida de nodo.
# 2. Se agrega "ignoreDifferences" para spec.replicas de Deployment (ver
#    comentario mas abajo) - necesario para que la Application llegue a
#    Synced de forma estable con los HPA activos; en P8 esto no se habia
#    notado porque la Application no se re-sincronizaba con tanta
#    frecuencia como en las pruebas repetidas de bootstrap de P9.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Oswaldo052001/Practicas-SA-B-201901844-gitops.git
    targetRevision: main
    path: apps/sa-platform
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
        - values-p8.yaml
        - values-secrets.yaml
        - values-images.yaml
        - values-p9-resilience.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  # auth-service, pago-service, reserva-service y notificacion-service
  # tienen HorizontalPodAutoscaler (ver charts/*/templates/hpa.yaml) que
  # cambia spec.replicas en vivo segun CPU. Sin este ignoreDifferences,
  # selfHeal pelea contra el HPA: ArgoCD ve el Deployment como OutOfSync
  # cada vez que el HPA escala, lo vuelve a fijar al valor estatico del
  # chart, el HPA lo cambia de nuevo - un ciclo que nunca deja la
  # Application en Synced de forma estable (el Health se mantiene Healthy
  # todo el tiempo, pero el Sync Status oscila). api-gateway usa Rollout,
  # no Deployment, y no lo afecta este ignoreDifferences.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # api-gateway no es un Deployment normal, es un Rollout de Argo
    # Rollouts (ver charts/api-gateway/templates/rollout.yaml), y su HPA
    # apunta el scaleTargetRef ahi (charts/api-gateway/templates/hpa.yaml:
    # "kind: Rollout", no "kind: Deployment") - por eso el ignoreDifferences
    # de arriba (group apps/Deployment) no lo cubria y seguia peleando con
    # el HPA exactamente igual, solo que ahora unicamente en este recurso
    # (confirmado: el ultimo Sync Result solo volvia a tocar el Rollout
    # api-gateway, ningun Deployment).
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
