# Respaldo separado, solo del Secret con la llave privada del controlador
# de Sealed Secrets (criterio 2.4 "Continuidad de los secretos"). Namespace
# distinto (kube-system) y filtrado por etiqueta para no llevarse de paso
# ningun otro Secret del sistema del cluster.
#
# Retencion mas larga que el respaldo de datos (90 dias vs. 30): perder
# esta llave vuelve indescifrable TODO lo sellado hasta ese momento, no
# solo los cambios de un dia.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: sealed-secrets-key-backup
  namespace: velero
spec:
  schedule: "0 4 * * *"
  template:
    includedNamespaces:
      - kube-system
    labelSelector:
      matchLabels:
        sealedsecrets.bitnami.com/sealed-secrets-key: active
    snapshotVolumes: false
    ttl: 2160h # 90 dias
    storageLocation: default
